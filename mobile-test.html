<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mobile layout verification</title></head>
<body>
<pre id="results">running…</pre>
<script>
function getStyle(doc, sel, props) {
  const el = doc.querySelector(sel);
  if (!el) return sel + ': NOT FOUND';
  const cs = doc.defaultView.getComputedStyle(el);
  return sel + ': ' + props.map(p => p + '=' + cs.getPropertyValue(p)).join(', ');
}

function verifyApp(doc, label) {
  const lines = [];
  lines.push('=== ' + label + ' ===');
  lines.push(getStyle(doc, '.menu-table-header', ['display']));
  lines.push(getStyle(doc, '.menu-mobile-active-label', ['display']));
  lines.push(getStyle(doc, '.menu-table-body', ['grid-template-columns']));
  lines.push(getStyle(doc, '.menu-table-cuisines', ['flex-direction', 'overflow-x']));
  lines.push(getStyle(doc, '.cuisine-row', ['white-space', 'border-radius', 'flex-direction']));
  lines.push(getStyle(doc, '.dish-card', ['flex-direction']));
  lines.push(getStyle(doc, '.dish-card-media', ['width']));
  lines.push(getStyle(doc, '.hero', ['min-height', 'padding-top']));
  lines.push(getStyle(doc, '.gallery-grid', ['grid-template-columns']));
  lines.push(getStyle(doc, '.title', ['font-size']));
  lines.push(getStyle(doc, '.section-title', ['margin-top', 'font-size']));
  // horizontal overflow check on the inner doc
  const root = doc.scrollingElement || doc.documentElement;
  lines.push('scrollWidth vs clientWidth: ' + root.scrollWidth + ' / ' + root.clientWidth + (root.scrollWidth > root.clientWidth ? ' <-- OVERFLOW!' : ' (ok)'));

  // DEBUG: report any element wider than the viewport, and any scrollable element
  const vw = root.clientWidth;
  const wide = [];
  doc.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && (r.right > vw + 0.5 || r.left < -0.5)) {
      const cls = (el.className && typeof el.className === 'string') ? el.className : el.tagName;
      if (wide.length < 12) wide.push(el.tagName.toLowerCase() + '.' + cls.split(' ')[0] + ' rect(l=' + Math.round(r.left) + ',r=' + Math.round(r.right) + ',w=' + Math.round(r.width) + ')');
    }
  });
  lines.push('elements beyond viewport: ' + (wide.length ? '\n  ' + wide.join('\n  ') : 'none (ok)'));

  // offset chain for key selectors
  const chains = [];
  ['.menu-section', '.menu-table', '.menu-table-body', '.menu-table-cuisines', '.two-col', '.hours-card', '.contact-card'].forEach(sel => {
    const el = doc.querySelector(sel);
    if (!el) return;
    const parts = [];
    let node = el;
    while (node && node !== doc.body) {
      parts.push((node.tagName.toLowerCase()) + (node.className && typeof node.className === 'string' ? '.' + node.className.split(' ')[0] : '') + '[' + node.offsetWidth + ']');
      node = node.offsetParent;
    }
    chains.push(sel + ' => ' + parts.join(' < '));
  });
  lines.push('offset chains:\n  ' + chains.join('\n  '));

  const overflow = [];
  doc.querySelectorAll('.dish-card').forEach((el, i) => {
    if (el.scrollWidth > el.clientWidth + 1) {
      let worst = '';
      let maxR = 0;
      el.querySelectorAll('*').forEach(ch => {
        const r = ch.getBoundingClientRect();
        if (r.right > maxR) { maxR = r.right; worst = ch.className || ch.tagName; }
      });
      overflow.push('#' + i + ' scrollW=' + el.scrollWidth + ' clientW=' + el.clientWidth + ' worstChild=' + worst + ' right=' + Math.round(maxR));
    }
  });
  lines.push('dish-cards overflowing: ' + (overflow.length ? '\n  ' + overflow.join('\n  ') : 'none (ok)'));
  return lines.join('\n');
}

const out = [];
function run() {
  try {
    const menuFrame = document.getElementById('menu-frame');
    const homeFrame = document.getElementById('home-frame');
    out.push(verifyApp(menuFrame.contentDocument, 'MENU PAGE @375px'));
    out.push('');
    out.push(verifyApp(homeFrame.contentDocument, 'HOME PAGE @375px'));
    out.push('');
    // desktop sanity check inside a wide frame
    const deskFrame = document.getElementById('desk-frame');
    out.push(verifyApp(deskFrame.contentDocument, 'MENU PAGE @1100px (desktop sanity)'));
  } catch (e) {
    out.push('ERROR: ' + e.message);
  }
  document.getElementById('results').textContent = out.join('\n');
}

// wait for both frames + React render
let loaded = 0;
function maybeRun() { if (++loaded === 3) setTimeout(run, 700); }
</script>
<iframe id="menu-frame" src="/menu" width="375" height="1400" style="border:0;display:block" onload="maybeRun()"></iframe>
<iframe id="home-frame" src="/" width="375" height="1400" style="border:0;display:block" onload="maybeRun()"></iframe>
<iframe id="desk-frame" src="/menu" width="1100" height="900" style="border:0;display:block" onload="maybeRun()"></iframe>
</body>
</html>
